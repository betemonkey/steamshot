// ---------- Year in review ----------
// A slideshow of one year compared with the same dates the year before, built
// only from history.json and the stored snapshots.
const yir = {slides: 0, cur: 0, timer: null, paused: false, data: null, opener: null};
const SLIDE_MS = 7000;
const shiftYear = (iso, dy) => `${+iso.slice(0, 4) + dy}-${iso.slice(5) === "02-29" ? "02-28" : iso.slice(5)}`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function yirYears() {
  if (!state.hist || !state.hist.since || !state.snap) return [];
  const out = [];
  for (let y = +state.snap.date.slice(0, 4); y >= +state.hist.since.slice(0, 4); y--) out.push(y);
  return out;
}
function yirWindow(year) {
  const snapIso = state.snap.date;
  return {start: `${year}-01-01`, end: year < +snapIso.slice(0, 4) ? `${year}-12-31` : snapIso};
}
function yirStats(start, end) {
  const days = histWindow(end, daysBetween(start, end) + 1);
  const per = {}, perDays = {}, months = Array(12).fill(0);
  let total = 0, played = 0, tracked = 0, big = null, best = {len: 0}, run = 0, runStart = null;
  days.forEach(d => {
    if (d.tracked) tracked++;
    if (d.mins) {
      played++; total += d.mins; months[+d.iso.slice(5, 7) - 1] += d.mins;
      if (!big || d.mins > big.mins) big = d;
      run++; if (run === 1) runStart = d.iso;
      if (run > best.len) best = {len: run, from: runStart, to: d.iso};
    } else run = 0;
    Object.entries(d.apps).forEach(([a, m]) => { if (m > 0) { per[a] = (per[a] || 0) + m; perDays[a] = (perDays[a] || 0) + 1; } });
  });
  const ranking = Object.entries(per).sort((a, b) => b[1] - a[1]).map(([a]) => a);
  return {start, end, days, per, perDays, months, total, played, tracked, big, best, ranking, n: days.length};
}
// How much of a window history really covers: it starts at the first snapshot
// (Steam keeps only a running total per game). The number of snapshot files is
// no guide to the rest - imported history comes without them.
function yirCoverage(st) {
  const since = state.hist.since, from = since > st.start ? since : st.start;
  return {since, from, partial: since > st.start, tracked: st.tracked, n: st.n};
}
const fullDate = iso => fmtDay(iso, {day: "numeric", month: "long", year: "numeric"});
// start..end as a strip with from..to filled in. mid labels where the filled part
// starts; an end label it would run into is left out.
function covBar(start, end, from, to, ends, mid) {
  const n = Math.max(1, daysBetween(start, end)), x = daysBetween(start, from) / n * 100, r = 100 - daysBetween(start, to) / n * 100;
  const pos = Math.min(Math.max(x, 8), 92), room = mid.length * 1.4 + 6;
  return `<div class="covbar"><div class="bar"><b style="left:${x.toFixed(2)}%;right:${r.toFixed(2)}%"></b></div><div class="ends">`
    + (pos > room ? `<span style="left:0">${esc(ends[0])}</span>` : "")
    + `<span style="left:${pos.toFixed(2)}%;transform:translateX(-50%)">${esc(mid)}</span>`
    + (pos < 100 - room ? `<span style="right:0">${esc(ends[1])}</span>` : "") + "</div></div>";
}
function yirWarning(cov, w) {
  let html = "";
  if (cov.partial) html += `<b>${cov.tracked} of ${cov.n} days recorded</b>, from your first snapshot`
    + covBar(w.start, w.end, cov.from, w.end, [fmtDay(w.start), fmtDay(w.end)], fmtDay(cov.since));
  const more = [];
  if (cov.tracked < 30) more.push("With this few days recorded, most slides will look thin.");
  if (more.length) html += `<p>${more.join(" ")}</p>`;
  return html;
}
function yirCompareOk(year) {
  const w = yirWindow(year);
  return yirStats(shiftYear(w.start, -1), shiftYear(w.end, -1)).tracked > 0;
}

function yirBuild(year, compare) {
  const snap = state.snap, w = yirWindow(year), cur = yirStats(w.start, w.end);
  let prev = null;
  if (compare) { const p = yirStats(shiftYear(w.start, -1), shiftYear(w.end, -1)); if (p.tracked) prev = p; }
  const byId = Object.fromEntries((snap.games || []).map(g => [String(g.appid), g]));
  const name = a => (byId[a] && byId[a].name) || "App " + a;
  // minutes each game had before this year: today's total minus what history saw since 1 January
  const since = {};
  histWindow(snap.date, daysBetween(w.start, snap.date) + 1).forEach(d => Object.entries(d.apps).forEach(([a, m]) => since[a] = (since[a] || 0) + m));
  const before = a => (byId[a] ? byId[a].minutes || 0 : 0) - (since[a] || 0);
  const fresh = cur.ranking.filter(a => before(a) <= 0);
  let comeback = null;
  if (prev && prev.tracked === prev.n)
    comeback = cur.ranking.find(a => !prev.per[a] && before(a) > 0) || null;
  // library size at the start and end of the window, from the stored snapshots
  const inWin = state.snaps.filter(s => s.date >= w.start && s.date <= w.end);
  const lib = inWin.length ? {start: inWin[0], end: inWin[inWin.length - 1]} : null;
  const unplayed = w.end === snap.date ? visibleGames(snap).filter(g => !g.minutes).length : null;
  const colsOf = a => (byId[a] && byId[a].collections && byId[a].collections.length) ? byId[a].collections : ["Not in a collection"];
  const colShare = st => {
    const by = Object.create(null);
    Object.entries(st.per).forEach(([a, m]) => colsOf(a).forEach(c => by[c] = (by[c] || 0) + m));
    return by;
  };
  const hasCols = (snap.games || []).some(g => g.collections && g.collections.length);
  const cov = yirCoverage(cur);
  return {year, w, cur, prev, name, fresh, comeback, lib, unplayed, byId, cov,
          cols: hasCols ? {cur: colShare(cur), prev: prev ? colShare(prev) : null} : null,
          persona: (snap.account || {}).persona || ""};
}

// ----- slides -----
function upDown(a, b, fmt = x => x) {
  const d = a - b;
  return d > 0 ? `<span class="up">▲ ${fmt(d)}</span>` : d < 0 ? `<span class="down">▼ ${fmt(-d)}</span>` : `<span>no change</span>`;
}
const longDate = iso => fmtDay(iso, {day: "numeric", month: "long"});
const hrs = m => fmtH(m) + " h";
function capImg(appid) {
  return state.options.images ? `<img alt="" src="${artUrl(appid, "capsule_231x87.jpg")}" onerror="if(this.dataset.f){this.remove()}else{this.dataset.f=1;this.src='${artUrl(appid, "header.jpg")}'}\">` : "";
}

function yirSlides(Y) {
  const {cur, prev, w, year} = Y, py = year - 1, out = [];
  const whole = w.end.slice(5) === "12-31";
  const range = whole ? `All of ${year}` : `${longDate(w.start)} to ${longDate(w.end)}`;
  const {cov} = Y, since = cov.since, partial = cov.partial;
  out.push(`<section class="slide intro"><div class="kicker">Your year on Steam</div><div class="yr">${year}</div>
    <p>${partial ? `${longDate(since)} to ${longDate(w.end)}` : range}${prev ? `, compared with the same dates in ${py}` : ""}</p>
    ${partial ? covBar(`${year}-01-01`, `${year}-12-31`, cov.from, w.end, [fmtDay(`${year}-01-01`, {month: "short"}), fmtDay(`${year}-12-31`, {month: "short"})], `first snapshot, ${fmtDay(since)}`) : ""}</section>`);

  // time played
  const perDay = cur.total / Math.max(1, cur.tracked);
  out.push(`<section class="slide"><div class="kicker">Time played</div><h2>${partial ? `Since ${longDate(since)}, you played for` : "You played for"}</h2>
    <div class="hero">${fmtH(cur.total)}<small>hours</small></div>
    <div class="vs">${prev ? `${upDown(cur.total, prev.total, hrs)}${prev.total ? ` (${cur.total >= prev.total ? "+" : "-"}${pct(Math.abs(cur.total - prev.total), prev.total)}%)` : ""} on ${py}'s ${hrs(prev.total)}. ` : ""}That's about ${Math.floor(perDay / 60) ? Math.floor(perDay / 60) + " h " : ""}${Math.round(perDay % 60)} min a day${partial ? ` over ${cov.tracked} days` : ""}.</div>
    ${partial ? `<div class="fine">Your first snapshot was on ${longDate(since)}. Steam only stores each game's total and the last day it was played, so hours from before then can't be counted.</div>` : ""}</section>`);

  // month by month
  const lastM = +w.end.slice(5, 7);
  const months = cur.months.slice(0, lastM), topM = months.indexOf(Math.max(...months));
  const MN = Array.from({length: 12}, (_, i) => new Date(Date.UTC(2000, i, 1)).toLocaleDateString(undefined, {month: "short", timeZone: "UTC"}));
  const MLONG = Array.from({length: 12}, (_, i) => new Date(Date.UTC(2000, i, 1)).toLocaleDateString(undefined, {month: "long", timeZone: "UTC"}));
  if (cur.total) out.push(`<section class="slide"><div class="kicker">Month by month${partial ? ` · ${longDate(since)} onward` : ""}</div>
    <h2>${MLONG[topM]} was your biggest month, at ${hrs(months[topM])}</h2>
    <div class="legend"><span><i style="background:var(--s-accent)"></i>${year}</span>${prev ? `<span><i style="background:var(--s-last)"></i>${py}</span>` : ""}</div>
    <div class="mchart" id="yirMonths">${monthChart(cur.months, prev && prev.months, lastM, MN, partial ? +since.slice(5, 7) - 1 : 0)}<div class="mtip" hidden></div></div></section>`);

  // top 5
  const top = cur.ranking.slice(0, 5);
  if (top.length) out.push(`<section class="slide"><div class="kicker">Your top ${top.length}</div><h2>The games you couldn't put down</h2>
    <ol class="top">${top.map((a, i) => {
      let badge = "";
      if (prev) {
        const r = prev.ranking.indexOf(a);
        badge = r === -1 ? `<span class="badge new">new</span>` : r === i ? `<span class="badge s">= #${i + 1}</span>`
          : r > i ? `<span class="badge u">▲ from #${r + 1}</span>` : `<span class="badge d">▼ from #${r + 1}</span>`;
      }
      return `<li><span class="rk">${i + 1}</span><div class="cap">${capImg(a)}</div><div><div class="nm">${esc(Y.name(a))}${badge}</div>
        <div class="m">${pct(cur.per[a], cur.total)}% of your playtime</div></div><span class="h">${hrs(cur.per[a])}</span></li>`;
    }).join("")}</ol></section>`);

  // game of the year
  if (top.length) {
    const a = top[0], pr = prev ? prev.ranking.indexOf(a) : -2;
    out.push(`<section class="slide"><div class="spot">
      <div class="pic"${state.options.images ? ` style="background-image:url(${artUrl(a, "header.jpg")})"` : ""}></div>
      <div><div class="kicker">Game of the year</div><h2>${esc(Y.name(a))}</h2>
        <div class="hero" style="font-size:84px">${fmtH(cur.per[a])}<small>hours</small></div>
        <div class="vs">${pct(cur.per[a], cur.total)}% of everything you played.${pr >= 0 ? ` It was #${pr + 1} in ${py} with ${hrs(prev.per[a])}.` : pr === -1 ? ` You didn't play it in ${py}.` : ""}</div>
        <div class="vs">You played it on <b>${cur.perDays[a]} ${cur.perDays[a] === 1 ? "day" : "days"}</b>.</div></div></div></section>`);
  }

  // consistency
  if (cur.tracked) {
    const big = cur.big, bigTop = big ? Object.entries(big.apps).sort((x, y) => y[1] - x[1])[0] : null;
    out.push(`<section class="slide"><div class="kicker">Consistency</div><h2>You played on ${cur.played} of ${cur.tracked} days</h2>
      ${calendar(cur, w)}
      <div class="calkey">less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> more
        ${partial ? `<i style="background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 2px,transparent 2px 4px)"></i> not recorded` : ""}
        ${cur.best.len ? `<i style="outline:1.5px solid #fff;outline-offset:-1px"></i> longest streak` : ""}</div>
      <div class="pair" style="margin-top:18px">
        <div class="cell"><div class="lbl">Longest streak</div><div class="n">${cur.best.len} ${cur.best.len === 1 ? "day" : "days"}</div>
          <div class="sub">${prev ? upDown(cur.best.len, prev.best.len) + ` vs ${prev.best.len} in ${py}` : ""}${cur.best.len ? `${prev ? ", " : ""}${fmtDay(cur.best.from)} to ${fmtDay(cur.best.to)}` : ""}</div></div>
        <div class="cell"><div class="lbl">Biggest day</div><div class="n">${big ? hrs(big.mins) : "0 h"}</div>
          <div class="sub">${big ? `${esc(fmtDay(big.iso, {weekday: "short", day: "numeric", month: "short"}))}, mostly ${esc(Y.name(bigTop[0]))}` : ""}</div></div>
      </div></section>`);
  }

  // variety
  const nGames = cur.ranking.length;
  if (nGames) {
    const cells = [];
    cells.push(`<div class="cell"><div class="lbl">Games played</div><div class="n">${nGames}</div><div class="sub">${prev ? `${upDown(nGames, prev.ranking.length)} vs ${prev.ranking.length} in ${py}` : "different games"}</div></div>`);
    cells.push(`<div class="cell"><div class="lbl">First played this year</div><div class="n">${Y.fresh.length}</div><div class="sub">${Y.fresh.length ? esc(Y.fresh.slice(0, 3).map(Y.name).join(", ")) + (Y.fresh.length > 3 ? ` and ${Y.fresh.length - 3} more` : "") : "All old favourites"}</div></div>`);
    if (Y.comeback) cells.push(`<div class="cell"><div class="lbl">Comeback of the year</div><div class="n word">${esc(Y.name(Y.comeback))}</div><div class="sub">${hrs(cur.per[Y.comeback])}, after not being played at all in ${py}</div></div>`);
    else { const a = Object.entries(cur.perDays).sort((x, y) => y[1] - x[1])[0][0];
      cells.push(`<div class="cell"><div class="lbl">Played on the most days</div><div class="n word">${esc(Y.name(a))}</div><div class="sub">${cur.perDays[a]} days</div></div>`); }
    if (Y.lib) {
      const added = Y.lib.end.games - Y.lib.start.games;
      cells.push(`<div class="cell"><div class="lbl">Library</div><div class="n">${Y.lib.end.games}</div><div class="sub">${added > 0 ? `<span class="up">▲ ${added} added</span>` : added < 0 ? `<span class="down">▼ ${-added}</span>` : "no change"} since ${fmtDay(Y.lib.start.date)}${Y.unplayed !== null ? `, ${Y.unplayed} still unplayed` : ""}</div></div>`);
    }
    out.push(`<section class="slide"><div class="kicker">Variety</div><h2>${nGames} different ${nGames === 1 ? "game" : "games"}${Y.fresh.length ? `, ${Y.fresh.length} of them new to you` : ""}</h2>
      <div class="pair">${cells.join("")}</div></section>`);
  }

  // collections
  if (Y.cols && cur.total) {
    const rows = Object.entries(Y.cols.cur).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const pt = prev ? prev.total : 0;
    const vals = rows.flatMap(([c, m]) => [pct(m, cur.total), prev ? pct(Y.cols.prev[c] || 0, pt) : 0]);
    const max = Math.max(...vals, 1);
    const gainer = prev ? rows.map(([c, m]) => [c, pct(m, cur.total) - pct(Y.cols.prev[c] || 0, pt)]).sort((a, b) => b[1] - a[1])[0] : null;
    out.push(`<section class="slide"><div class="kicker">What you played</div>
      <h2>${gainer && gainer[1] > 0 ? `${esc(gainer[0])} took a bigger share this year` : `Mostly ${esc(rows[0][0])}`}</h2>
      <div class="legend"><span><i style="background:var(--s-accent)"></i>${year}</span>${prev ? `<span><i style="background:var(--s-last)"></i>${py}</span>` : ""}</div>
      <div class="share">${rows.map(([c, m]) => { const t = pct(m, cur.total), l = prev ? pct(Y.cols.prev[c] || 0, pt) : null;
        return `<div class="r"><span class="nm">${esc(c)}</span><div class="tr"><div class="b" style="width:${t / max * 100}%"></div>${l !== null ? `<div class="b l" style="width:${l / max * 100}%"></div>` : ""}</div>
          <span class="v"><b>${t}%</b>${l !== null ? ` · ${l}%` : ""}</span></div>`; }).join("")}</div>
      <div class="fine">Share of your playtime per Steam collection. A game in several collections counts in each.</div></section>`);
  }

  // summary card
  const em = (a, b, f = x => x) => prev ? (a - b > 0 ? `<em class="up">+${f(a - b)}</em>` : a - b < 0 ? `<em class="down">-${f(b - a)}</em>` : "") : "";
  const tm = cur.total ? MN[topM] : "-";
  Y.summary = [["Hours played", fmtH(cur.total), em(cur.total, prev ? prev.total : 0, fmtH)],
               ["Days played", cur.played, em(cur.played, prev ? prev.played : 0)],
               ["Longest streak", cur.best.len + " d", em(cur.best.len, prev ? prev.best.len : 0)],
               ["Games played", nGames, em(nGames, prev ? prev.ranking.length : 0)],
               ["New to you", Y.fresh.length, ""],
               ["Top month", tm, cur.total ? `<em style="color:var(--s-ink-2)">${hrs(months[topM])}</em>` : ""]];
  out.push(`<section class="slide"><div class="card-sum">
      <div class="hd"><b>${esc(Y.persona ? Y.persona + "'s " : "")}${year}</b><span>${whole && !partial ? "All year" : fmtDay(cov.from) + " to " + fmtDay(w.end)}${prev ? `, vs ${py}` : ""}</span></div>
      <div class="g">${Y.summary.map(([l, v, e]) => `<div><span>${l}</span><b>${v}</b>${e}</div>`).join("")}</div>
      ${state.options.images && top.length ? `<div class="tops">${top.map(a => `<div style="background-image:url(${artUrl(a, "capsule_231x87.jpg")}),url(${artUrl(a, "header.jpg")})"></div>`).join("")}</div>` : ""}
    </div>
    <div class="sum-actions"><button id="yirSave">Save as image</button><button id="yirAgain">Watch again</button></div></section>`);
  return out.join("");
}

function monthChart(curM, prevM, lastM, MN, fromM = 0) {
  const W = 900, H = 300, L = 40, B = 26, T = 10;
  const vals = [...curM.slice(0, lastM), ...(prevM ? prevM.slice(0, lastM) : [])];
  const maxH = Math.max(...vals, 60) / 60, step = niceStep(maxH), top = Math.ceil(maxH / step) * step;
  const y = h => T + (H - T - B) * (1 - h / top);
  // before the first snapshot there's nothing to show, so those months are left off
  const shown = MN.map((m, i) => i).filter(i => i >= fromM && (!fromM || i < lastM));
  const gw = (W - L) / shown.length, bw = Math.min(shown.length < 12 && !prevM ? 44 : 26, gw * .32);
  const bar = (x, m, fill) => { if (!m) return ""; const y1 = y(m / 60), r = Math.min(4, H - B - y1);
    return `<path fill="${fill}" d="M${x},${H - B} V${y1 + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${H - B} Z"/>`; };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours per month">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="t" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  shown.forEach((i, k) => {
    const m = MN[i], cx = L + gw * k + gw / 2;
    if (i < lastM) {
      if (prevM) s += bar(cx - bw - 1, prevM[i], "var(--s-last)");
      s += bar(prevM ? cx + 1 : cx - bw / 2, curM[i], "var(--s-accent)");
      s += `<rect data-m="${i}" x="${L + gw * k}" y="0" width="${gw}" height="${H - B}" fill="transparent"/>`;
    }
    s += `<text class="t" x="${cx}" y="${H - 6}" text-anchor="middle">${m}</text>`;
  });
  return s + "</svg>";
}

function calendar(cur, w) {
  const vals = cur.days.filter(d => d.mins).map(d => d.mins).sort((a, b) => a - b);
  const q = p => vals[Math.floor(p * (vals.length - 1))] || 1;
  const cuts = [q(.25), q(.5), q(.75)];
  const startT = toUTC(w.start), endT = toUTC(w.end);
  const first = startT - ((new Date(startT).getUTCDay() + 6) % 7) * DAY;
  const byIso = Object.fromEntries(cur.days.map(d => [d.iso, d]));
  let html = "";
  for (let t = first; t <= endT || (new Date(t).getUTCDay() + 6) % 7 !== 0; t += DAY) {
    const iso = isoOf(t), d = byIso[iso];
    if (!d) { html += `<i class="out"></i>`; continue; }
    const st = cur.best.len && iso >= cur.best.from && iso <= cur.best.to ? " st" : "";
    const label = `${fmtDay(iso, {weekday: "short", day: "numeric", month: "short"})}: ${!d.tracked ? "not recorded" : d.mins ? hrs(d.mins) : "not played"}`;
    const lvl = !d.tracked ? "nr" : !d.mins ? "" : d.mins <= cuts[0] ? "l1" : d.mins <= cuts[1] ? "l2" : d.mins <= cuts[2] ? "l3" : "l4";
    html += `<i class="${lvl}${st}" title="${esc(label)}"></i>`;
  }
  return `<div class="cal" role="img" aria-label="Hours per day">${html}</div>`;
}

// ----- dialog and playback -----
function openYirDialog() {
  const dlg = $("#yirDlg"), ys = $("#yirYear"), cs = $("#yirCmp");
  const years = yirYears();
  ys.innerHTML = years.map(y => `<option value="${y}">${y}${y === +state.snap.date.slice(0, 4) && !state.snap.date.endsWith("12-31") ? " (so far)" : ""}</option>`).join("");
  const sync = () => {
    const y = +ys.value, ok = yirCompareOk(y), w = yirWindow(y), cov = yirCoverage(yirStats(w.start, w.end)), warn = yirWarning(cov, w);
    cs.innerHTML = `<option value="1"${ok ? "" : " disabled"}>${y - 1}${ok ? "" : " (not recorded)"}</option><option value="0"${ok ? "" : " selected"}>Nothing</option>`;
    $("#yirWarn").innerHTML = warn;
    $("#yirWarn").hidden = !warn;
    const steam = "Steam keeps each game's total and last-played date, not playtime per day.";
    $("#yirHint").textContent = (cov.partial ? `Earlier days can't be filled in: ${steam}${ok ? "" : ` That's also why ${y - 1} can't be compared.`} `
      : !ok ? `${y - 1} can't be compared: your snapshots start on ${fullDate(cov.since)}. ${steam} `
      : w.end.endsWith("12-31") ? "Uses the whole year. " : `Uses ${longDate(w.start)} to ${longDate(w.end)} of each year, so a year still in progress is compared fairly. `)
      + "Built from your snapshots and history on this computer. Nothing is sent anywhere.";
  };
  ys.onchange = sync;
  sync();
  yir.opener = document.activeElement;
  dlg.showModal();
}
function yirStart() {
  $("#yirDlg").close();
  const Y = yirBuild(+$("#yirYear").value, $("#yirCmp").value === "1");
  yir.data = Y;
  const show = $("#show");
  $("#yirStage").innerHTML = yirSlides(Y);
  $("#yirWho").textContent = `Year in review${Y.persona ? ", " + Y.persona : ""}`;
  yir.slides = show.querySelectorAll(".slide").length;
  $("#yirProg").innerHTML = Array.from({length: yir.slides}, () => "<span><i></i></span>").join("");
  wireMonthTip(Y);
  $("#yirSave").onclick = () => yirSaveImage(Y);
  $("#yirAgain").onclick = () => yirGo(0);
  show.hidden = false;
  document.body.style.overflow = "hidden";
  yir.paused = matchMedia("(prefers-reduced-motion: reduce)").matches;
  yirPauseLabel();
  yirGo(0);
  $("#yirClose").focus();
}
function yirGo(n) {
  const slides = document.querySelectorAll("#yirStage .slide"), bars = document.querySelectorAll("#yirProg span");
  yir.cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle("on", i === yir.cur));
  bars.forEach((b, i) => { b.className = i < yir.cur ? "done" : ""; });
  void bars[yir.cur].offsetWidth;
  bars[yir.cur].className = yir.cur === slides.length - 1 || yir.paused ? "done" : "now";
  clearTimeout(yir.timer);
  if (!yir.paused && yir.cur < slides.length - 1) yir.timer = setTimeout(() => yirGo(yir.cur + 1), SLIDE_MS);
}
function yirPauseLabel() {
  $("#show").classList.toggle("paused", yir.paused);
  $("#yirPause").textContent = yir.paused ? "▶ Play" : "❚❚ Pause";
}
function yirTogglePause() { yir.paused = !yir.paused; yirPauseLabel(); yirGo(yir.cur); }
function yirClose() {
  clearTimeout(yir.timer);
  $("#show").hidden = true;
  document.body.style.overflow = "";
  if (yir.opener && yir.opener.focus) yir.opener.focus();
}
function wireMonthTip(Y) {
  const box = $("#yirMonths");
  if (!box) return;
  const tip = $(".mtip", box), svg = box.querySelector("svg");
  const MLONG = i => new Date(Date.UTC(2000, i, 1)).toLocaleDateString(undefined, {month: "long", timeZone: "UTC"});
  svg.addEventListener("mousemove", e => {
    const i = e.target.dataset && e.target.dataset.m;
    if (i === undefined) { tip.hidden = true; return; }
    tip.innerHTML = `<b>${MLONG(+i)}</b>${Y.year}: ${hrs(Y.cur.months[i])}${Y.prev ? `<br>${Y.year - 1}: ${hrs(Y.prev.months[i])}` : ""}`;
    tip.hidden = false;
    const r = box.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - r.left + 12, r.width - tip.offsetWidth) + "px";
    tip.style.top = (e.clientY - r.top - tip.offsetHeight - 8) + "px";
  });
  svg.addEventListener("mouseleave", () => tip.hidden = true);
}
// the summary card as a PNG, drawn on a canvas (text only: Steam's art can't be
// copied into a downloadable image from another site)
function yirSaveImage(Y) {
  const c = document.createElement("canvas"), W = 1200, H = 630;
  c.width = W; c.height = H;
  const g = c.getContext("2d"), font = s => `${s} system-ui, -apple-system, "Segoe UI", sans-serif`;
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#173a66"); bg.addColorStop(.7, "#151a33"); bg.addColorStop(1, "#0b0b0d");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = "#ffffff"; g.font = font("bold 54px"); g.fillText(`${Y.persona ? Y.persona + "'s " : ""}${Y.year} on Steam`, 70, 120);
  g.fillStyle = "#c3c2b7"; g.font = font("26px");
  const whole = Y.w.end.endsWith("12-31");
  g.fillText(`${whole && !Y.cov.partial ? "All year" : fmtDay(Y.cov.from) + " to " + fmtDay(Y.w.end)}${Y.prev ? ", compared with " + (Y.year - 1) : ""}`, 70, 165);
  Y.summary.forEach(([label, value], i) => {
    const x = 70 + (i % 3) * 360, y = 270 + Math.floor(i / 3) * 150;
    g.fillStyle = "#c3c2b7"; g.font = font("24px"); g.fillText(label, x, y);
    g.fillStyle = "#ffffff"; g.font = font("bold 64px"); g.fillText(String(value), x, y + 70);
  });
  const lead = Y.cur.ranking[0];
  g.fillStyle = "#8f8e88"; g.font = font("22px");
  g.fillText(`${lead ? "Game of the year: " + Y.name(lead) + "   " : ""}Made with Steamshot`, 70, H - 50);
  c.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `steamshot-${Y.year}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
}
(function wireYir() {
  $("#yir").onclick = openYirDialog;
  $("#yirCancel").onclick = () => $("#yirDlg").close();
  $("#yirGo").onclick = yirStart;
  $("#yirNext").onclick = () => yirGo(yir.cur + 1);
  $("#yirPrev").onclick = () => yirGo(yir.cur - 1);
  $("#yirClose").onclick = yirClose;
  $("#yirPause").onclick = yirTogglePause;
  document.addEventListener("keydown", e => {
    if ($("#show").hidden) return;
    if (e.key === "ArrowRight") yirGo(yir.cur + 1);
    else if (e.key === "ArrowLeft") yirGo(yir.cur - 1);
    else if (e.key === "Escape") yirClose();
    else if (e.key === " ") { e.preventDefault(); yirTogglePause(); }
  });
})();

// ---------- updates ----------
// The server restarts itself after an update; when it answers with a new
// version, reload so the page runs the new code too.
function notice(html, key) {
  const el = $("#notice");
  if (!html || (key && stored("ssDismissed") === key)) { el.hidden = true; return; }
  el.innerHTML = `<span>${html}</span><span class="spacer"></span><button aria-label="Dismiss">✕</button>`;
  el.querySelector("button").onclick = () => { el.hidden = true; if (key) store("ssDismissed", key); };
  el.hidden = false;
}

function watchVersion(loaded) {
  const seen = stored("ssVersion");
  store("ssVersion", loaded);
  if (seen && seen !== loaded) notice(`Steamshot was updated to <b>${esc(loaded)}</b>.`);
  async function check() {
    let v;
    try { v = await api("/api/version"); } catch (e) { return; }  // restarting, or stopped
    if (v.running !== loaded) { if ($("#show").hidden) location.reload(); return; }  // not mid-slideshow: after it closes
    if (v.available) {
      const how = v.auto && v.status !== "manual" ? "It will install itself shortly."
        : `${v.reason ? esc(v.reason[0].toUpperCase() + v.reason.slice(1)) + ", so it" : "It"} can't install itself.
           Update by running <code>git pull</code> in the Steamshot folder.`;
      notice(`Steamshot <b>${esc(v.latest)}</b> is available (you have ${esc(v.running)}). ${how}`, v.latest);
    }
  }
  check();
  setInterval(check, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
}

boot().catch(e => { $("#main").innerHTML = `<p class="empty">Something went wrong: ${esc(e.message)}</p>`; });
</script>
