<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steamshot: Shelf</title>
<style>
/* Direction A: cover art first. Accent stays the current blue. */
:root {
  color-scheme: light;
  --page: #f4f4f2; --surface: #ffffff; --raise: #ebebe7;
  --ink: #141413; --ink-2: #55544f; --muted: #8a8983;
  --line: rgba(20, 20, 19, .10); --grid: #e3e2dc;
  --accent: #2a78d6; --accent-wash: rgba(42, 120, 214, .12);
  --scrim: linear-gradient(90deg, rgba(10,10,12,.88) 0%, rgba(10,10,12,.55) 45%, rgba(10,10,12,.05) 100%);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f0f10; --surface: #19191a; --raise: #232325;
    --ink: #f2f2f0; --ink-2: #b9b8b2; --muted: #85847f;
    --line: rgba(255, 255, 255, .09); --grid: #2a2a2c;
    --accent: #3987e5; --accent-wash: rgba(57, 135, 229, .18);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f10; --surface: #19191a; --raise: #232325;
  --ink: #f2f2f0; --ink-2: #b9b8b2; --muted: #85847f;
  --line: rgba(255, 255, 255, .09); --grid: #2a2a2c;
  --accent: #3987e5; --accent-wash: rgba(57, 135, 229, .18);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 56px; }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { background: var(--raise); }
button:active { transform: translateY(1px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mock { position: fixed; right: 12px; bottom: 12px; z-index: 20; font-size: 11px; font-weight: 700; background: #e5a000; color: #111; padding: 3px 8px; border-radius: 6px; }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.who { color: var(--ink-2); white-space: nowrap; }
.spacer { flex: 1; }

/* hero: the game you're on right now */
.hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 300px; background: #111 center/cover no-repeat; display: grid; grid-template-columns: 1.2fr 1fr; align-items: end; color: #fff; }
.hero::before { content: ""; position: absolute; inset: 0; background: var(--scrim); }
.hero > * { position: relative; }
.hero .copy { padding: 28px 30px; }
.hero .lbl { color: rgba(255,255,255,.75); font-size: 13px; }
.hero h1 { margin: 4px 0 6px; font-size: clamp(28px, 4vw, 44px); line-height: 1.05; letter-spacing: -.02em; }
.hero .facts { color: rgba(255,255,255,.85); font-size: 15px; }
.hero .facts b { color: #fff; }
.hero .spark { padding: 24px 30px; align-self: end; }
.hero .spark svg { width: 100%; height: 70px; display: block; }
.hero .spark .cap { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 4px; }

/* shelf of portrait covers */
section { margin-top: 34px; }
.h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.h h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.h .sub { color: var(--ink-2); }
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.cover { scroll-snap-align: start; }
.cover .art { aspect-ratio: 2 / 3; border-radius: var(--radius); background: var(--raise) center/cover; position: relative; overflow: hidden; transition: transform .2s cubic-bezier(.16,1,.3,1); }
.cover:hover .art { transform: translateY(-3px); }
.noart { display: grid; place-items: center; padding: 12px; text-align: center; color: var(--ink-2); font-weight: 600; }
.noart::after { content: attr(data-name); }
.cover .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .t { margin-top: 8px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cover .m { color: var(--ink-2); font-size: 13px; }
.cover .m b { color: var(--ink); }

/* figures + chart */
.split { display: grid; grid-template-columns: 2.2fr 1fr; gap: 28px; align-items: start; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 300px; overflow: visible; }
.tick { fill: var(--muted); font-size: 11px; }
.figs { display: grid; gap: 18px; padding-top: 6px; }
.fig .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.fig .l { color: var(--ink-2); }
.fig .d { color: var(--muted); font-size: 12.5px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: none; min-width: 150px; z-index: 5; }
.tip b { display: block; }
.tip div { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }

/* wishlist strip */
.wish { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.wi .art { aspect-ratio: 460 / 215; border-radius: var(--radius); background: var(--raise); overflow: hidden; }
.wi .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wi .t { margin-top: 8px; font-weight: 600; }
.wi .m { color: var(--ink-2); font-size: 13px; }
.wi .soon { color: var(--accent); font-weight: 600; }

/* library grid */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.filters button { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--accent-wash); border-color: transparent; color: var(--ink); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 18px 14px; }
.lib .cover .m span { color: var(--muted); }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .hero .spark { display: none; }
  .split { grid-template-columns: 1fr; }
  .figs { grid-template-columns: repeat(2, 1fr); }
  .wish { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .cover .art { transition: none; } }
</style>
</head>
<body>
<div class="mock">MOCKUP A · INVENTED DATA</div>
<div class="wrap">
  <header class="top">
    <span class="brand">Steamshot</span>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <select aria-label="Snapshot"><option>3 Oct 2026</option></select>
    <button id="theme" aria-label="Switch light or dark">◐</button>
  </header>

  <div class="hero" id="hero">
    <div class="copy">
      <div class="lbl">Most played this month</div>
      <h1 id="heroName"></h1>
      <div class="facts" id="heroFacts"></div>
    </div>
    <div class="spark"><svg id="heroSpark" preserveAspectRatio="none"></svg><div class="cap">Hours per day, last 30 days</div></div>
  </div>

  <section>
    <div class="h"><h2>Played lately</h2><span class="sub">last 30 days, most hours first</span></div>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="split">
    <div>
      <div class="h"><h2>Playtime per day</h2><span class="sub" id="chartSub"></span></div>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    </div>
    <div class="figs" id="figs"></div>
  </section>

  <section>
    <div class="h"><h2>Coming up on your wishlist</h2></div>
    <div class="wish" id="wish"></div>
  </section>

  <section>
    <div class="h"><h2>Library</h2><span class="sub" id="libCount"></span></div>
    <div class="filters" id="filters"></div>
    <div class="lib" id="lib"></div>
  </section>
</div>

<script src="data.js"></script>
<script>
"use strict";
const D = window.DEMO, $ = s => document.querySelector(s);
const DAY = 864e5, toUTC = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const iso = t => new Date(t).toISOString().slice(0, 10);
const lastN = n => Array.from({length: n}, (_, i) => iso(toUTC(D.date) - (n - 1 - i) * DAY));
const day = d => D.days[d] || {};
const total = d => Object.values(day(d)).reduce((a, b) => a + b, 0);
const mins = (id, ds) => ds.reduce((a, d) => a + (day(d)[id] || 0), 0);
const fmtH = m => { const h = m / 60; return h >= 100 ? Math.round(h).toLocaleString() : h >= 10 ? h.toFixed(0) : h.toFixed(1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const art = (id, kind) => `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${id}/${kind}`;
// cover art, then a second art size, then the game's name on a plain tile
const img = (id, kind, fb) => `<img loading="lazy" alt="" src="${art(id, kind)}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${art(id, fb)}'}else{this.parentNode.classList.add('noart');this.remove()}">`;
const ago = t => { const d = Math.round((toUTC(D.date) + DAY - t * 1000) / DAY); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };

(function theme() {
  $("#theme").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  };
})();

const d30 = lastN(30), dPrev = lastN(60).slice(0, 30);
const games = D.games.map(g => ({...g, m30: mins(g.appid, d30)}));
const byRecent = games.filter(g => g.m30 > 0).sort((a, b) => b.m30 - a.m30);
$("#who").textContent = D.persona;

// hero
const lead = byRecent[0];
$("#hero").style.backgroundImage = `url(${art(lead.appid, "library_hero.jpg")}), url(${art(lead.appid, "header.jpg")})`;
$("#heroName").textContent = lead.name;
$("#heroFacts").innerHTML = `<b class="num">${fmtH(lead.m30)} h</b> in the last 30 days, <b class="num">${fmtH(lead.minutes)} h</b> in total. Last played ${ago(lead.lastPlayed)}.`;
(function spark() {
  const vals = d30.map(d => day(d)[lead.appid] || 0), max = Math.max(...vals, 1), W = 300, H = 70, bw = W / vals.length;
  $("#heroSpark").setAttribute("viewBox", `0 0 ${W} ${H}`);
  $("#heroSpark").innerHTML = vals.map((v, i) => v ? `<rect x="${i * bw + 1}" y="${H - v / max * H}" width="${bw - 2}" height="${v / max * H}" rx="2" fill="rgba(255,255,255,.85)"><title>${d30[i]}: ${fmtH(v)} h</title></rect>` : "").join("");
})();

// shelf
$("#shelf").innerHTML = byRecent.slice(0, 10).map(g => `<div class="cover"><div class="art" data-name="${esc(g.name)}">${img(g.appid, "library_600x900.jpg", "header.jpg")}</div>
  <div class="t" title="${esc(g.name)}">${esc(g.name)}</div><div class="m"><b class="num">${fmtH(g.m30)} h</b> this month</div></div>`).join("");

// per-day chart (one series, one axis)
(function chart() {
  const vals = d30.map(total), max = Math.ceil(Math.max(...vals) / 60 / 2) * 2 * 60 || 60;
  const W = 760, H = 300, L = 30, B = 22, gw = (W - L) / vals.length, bw = gw - 3;
  const y = v => (H - B) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Hours played per day, last 30 days">`;
  for (let h = 0; h <= max / 60; h += 2) s += `<line x1="${L}" x2="${W}" y1="${y(h * 60)}" y2="${y(h * 60)}" stroke="var(--grid)"/><text class="tick" x="${L - 6}" y="${y(h * 60) + 4}" text-anchor="end">${h}h</text>`;
  vals.forEach((v, i) => {
    const x = L + i * gw + 1.5;
    if (d30[i] < D.since) s += `<rect x="${x}" y="0" width="${bw}" height="${H - B}" fill="var(--raise)" opacity=".6"/>`;
    else if (v) { const h = H - B - y(v), r = Math.min(4, h); s += `<path fill="var(--accent)" d="M${x},${H - B} V${y(v) + r} q0,-${r} ${r},-${r} H${x + bw - r} q${r},0 ${r},${r} V${H - B} Z"/>`; }
    if (i % 7 === 0 || (i === vals.length - 1 && i % 7 > 2)) s += `<text class="tick" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${new Date(toUTC(d30[i])).toLocaleDateString(undefined, {day: "numeric", month: "short", timeZone: "UTC"})}</text>`;
    s += `<rect data-i="${i}" x="${L + i * gw}" y="0" width="${gw}" height="${H - B}" fill="transparent"/>`;
  });
  $("#chart").insertAdjacentHTML("afterbegin", s + "</svg>");
  const played = vals.filter(Boolean).length;
  $("#chartSub").textContent = `${played} of 30 days played`;
  const tip = $("#tip"), box = () => $("#chart").getBoundingClientRect();
  $("#chart svg").addEventListener("mousemove", e => {
    const i = e.target.dataset.i; if (i == null) return;
    const rows = Object.entries(day(d30[i])).sort((a, b) => b[1] - a[1]).slice(0, 4)
      .map(([id, m]) => `<div><span>${esc((games.find(g => g.appid == id) || {}).name || id)}</span><span class="num">${fmtH(m)} h</span></div>`).join("");
    tip.innerHTML = `<b>${new Date(toUTC(d30[i])).toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short", timeZone: "UTC"})}: ${fmtH(vals[i])} h</b>${rows || "<div>Nothing played</div>"}`;
    const b = box(); tip.style.display = "block";
    tip.style.left = Math.min(e.clientX - b.left + 14, b.width - 220) + "px"; tip.style.top = (e.clientY - b.top - 20) + "px";
  });
  $("#chart svg").addEventListener("mouseleave", () => tip.style.display = "none");
})();

// figures (plain, no cards)
const sum = a => a.reduce((x, y) => x + y, 0);
const m30 = sum(d30.map(total)), mPrev = sum(dPrev.filter(d => d >= D.since).map(total));
const never = games.filter(g => !g.minutes).length, inst = games.filter(g => g.installed);
$("#figs").innerHTML = [
  [`${fmtH(m30)} h`, "last 30 days", `${fmtH(mPrev)} h the 30 before`],
  [`${fmtH(sum(games.map(g => g.minutes)))} h`, "in total", `across ${games.length} games`],
  [`${never}`, "never played", `${Math.round(never / games.length * 100)}% of the library`],
  [`${Math.round(sum(inst.map(g => g.bytes || 0)) / 1e9)} GB`, "installed", `${inst.length} games on disk`],
].map(([v, l, d]) => `<div class="fig"><div class="v num">${v}</div><div class="l">${l}</div><div class="d">${d}</div></div>`).join("");

// wishlist
const upcoming = D.wishlist.filter(w => w.comingSoon).sort((a, b) => (a.releaseISO || "9") < (b.releaseISO || "9") ? -1 : 1).slice(0, 4);
$("#wish").innerHTML = upcoming.map(w => {
  const days = w.releaseISO ? Math.round((toUTC(w.releaseISO) - toUTC(D.date)) / DAY) : null;
  return `<div class="wi"><div class="art" data-name="${esc(w.name)}">${img(w.appid, "header.jpg", "capsule_616x353.jpg")}</div><div class="t">${esc(w.name)}</div>
    <div class="m">${days == null ? "To be announced" : `<span class="soon">in ${days} day${days === 1 ? "" : "s"}</span>, ${esc(w.release)}`}</div></div>`;
}).join("");

// library as covers
const cols = [...new Set(games.flatMap(g => g.collections || []))];
const FILTERS = [["All", () => true], ["Installed", g => g.installed], ["Never played", g => !g.minutes], ...cols.map(c => [c, g => (g.collections || []).includes(c)])];
let pick = 0;
function lib() {
  const list = games.filter(FILTERS[pick][1]).sort((a, b) => b.minutes - a.minutes);
  $("#filters").innerHTML = FILTERS.map(([n], i) => `<button aria-pressed="${i === pick}" data-i="${i}">${esc(n)}</button>`).join("");
  $("#libCount").textContent = `${list.length} of ${games.length} games`;
  $("#lib").innerHTML = list.map(g => `<div class="cover"><div class="art" data-name="${esc(g.name)}">${img(g.appid, "library_600x900.jpg", "header.jpg")}</div>
    <div class="t" title="${esc(g.name)}">${esc(g.name)}</div><div class="m">${g.minutes ? `<b class="num">${fmtH(g.minutes)} h</b>` : "<span>Not played yet</span>"}</div></div>`).join("");
}
$("#filters").onclick = e => { if (e.target.dataset.i) { pick = +e.target.dataset.i; lib(); } };
lib();
</script>
</body>
</html>
