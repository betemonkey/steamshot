<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Year in review button</title>
<style>
/* The Year in review button with white text: which orange (Monkey, 4 Oct:
   "maybe try this color b55b26 ? or suggest some orange alternatives").
   Ember tokens from web/index.html; the header row is copied from the page. */
:root {
  color-scheme: dark;
  --page: #1f1b18; --surface: #2a2420; --surface-2: #362e29;
  --ink: #f6f0ea; --ink-2: #cbbfb4; --muted: #998c80; --border: rgba(255, 230, 210, .09);
  --accent: #f08a4f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; }
.lede { color: var(--ink-2); max-width: 760px; margin: 0 0 24px; }
.mock-tag { position: fixed; right: 12px; bottom: 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; background: #e5a000; color: #000; padding: 3px 8px; border-radius: 6px; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.yir-btn { background: var(--bg); color: #fff; border-color: transparent; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.yir-btn:hover { filter: brightness(1.1); }
.yir-btn svg { width: 13px; height: 13px; flex: none; }
.switch { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface-2); }
.switch button { border: 0; background: none; border-radius: 999px; padding: 4px 14px; color: var(--ink-2); font-weight: 600; }
.switch button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.row.pick { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.row .k { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--accent); font-weight: 700; }
.hdr { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 14px; border-radius: 10px;
  background: linear-gradient(90deg, rgba(31,27,24,.95), rgba(31,27,24,.7)), repeating-linear-gradient(120deg, #3a2a20 0 40px, #2a201a 40px 80px); }
.hdr .ttl { font-weight: 700; font-size: 17px; margin-right: auto; } .hdr .ttl span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
.hdr .sn { color: var(--ink-2); }
.meta { text-align: right; min-width: 150px; }
.meta b { display: block; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.meta span { font-size: 12px; color: var(--muted); }
.meta .ok { color: #8fd16a; } .meta .lo { color: #e3a35a; }
.sub { grid-column: 2 / 4; color: var(--ink-2); font-size: 12.5px; margin-top: -4px; }
h2 { font-size: 16px; margin: 34px 0 6px; }
.big { display: flex; gap: 14px; flex-wrap: wrap; padding: 24px; border-radius: 14px; background: #171311; }
.big .yir-btn { font-size: 20px; padding: 12px 20px; border-radius: 12px; } .big .yir-btn svg { width: 18px; height: 18px; }
@media (max-width: 640px) { .row { grid-template-columns: 24px minmax(0, 1fr); } .meta { grid-column: 2; text-align: left; } .sub { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Year in review button: which orange?</h1>
  <p class="lede">White text needs a darker orange than Ember's accent (<code>#f08a4f</code>, 2.5:1). Each row is the real header strip with one candidate. 4.5:1 is the usual minimum for text this size. <b>B</b> is live now (1.6.5). Pick a letter.</p>
  <div class="rows" id="rows"></div>

  <h2>Side by side, larger</h2>
  <div class="big" id="big"></div>
</div>
<div class="mock-tag">MOCKUP</div>
<script>
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
const L = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const cr = h => 1.05 / (L(h) + .05);
const OPTS = [
  ["A", "#f08a4f", "Ember's accent as is", "what it was in 1.6.4"],
  ["B", "#b55b26", "Burnt orange", "your pick, live now"],
  ["C", "#aa6238", "Ember's orange, darkened", "the same hue as the page's other orange, only darker"],
  ["D", "#c4652d", "Brighter burnt orange", "livelier, just under the minimum"],
  ["E", "#a8521f", "Rust", "deeper and redder"],
  ["F", "#9c4a1c", "Brick", "strongest contrast, the least 'orange'"],
];
document.getElementById("rows").innerHTML = OPTS.map(([k, c, name, sub]) => {
  const r = cr(c), cls = r >= 4.5 ? "ok" : "lo";
  return `<div class="row${k === "B" ? " pick" : ""}"><span class="k">${k}</span>
    <div class="hdr"><span class="ttl">Steam snapshot<span>Bete Monkey</span></span>
      <button class="yir-btn" style="--bg:${c}">${STAR}Year in review</button>
      <span class="switch"><button class="on">Shelf</button><button>Tiles</button></span><span class="sn">Snapshot</span></div>
    <div class="meta"><b>${c}</b><span class="${cls}">${r.toFixed(1)}:1 ${r >= 4.5 ? "passes" : "below 4.5"}</span></div>
    <div class="sub"><b>${name}</b> · ${sub}</div></div>`;
}).join("");
document.getElementById("big").innerHTML = OPTS.map(([k, c]) => `<button class="yir-btn" style="--bg:${c}">${STAR}${k}</button>`).join("");
</script>
</body>
</html>
